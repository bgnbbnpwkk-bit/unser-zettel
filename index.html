<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/unser-zettel/apple-touch-icon.png">
    <link rel="manifest" href="/unser-zettel/manifest.json">
    <title>Unser Zettel</title>
    <style>
      html, body, #root {
        background: #0f0c1a;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let reloading = false
        const reload = () => { if (!reloading) { reloading = true; location.reload() } }

        // Reload when new SW takes control or sends update message
        navigator.serviceWorker.addEventListener('controllerchange', reload)
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data?.type === 'SW_UPDATED') reload()
        })

        let swReg = null
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/unser-zettel/sw.js').then(reg => { swReg = reg })
        })

        // On each app-foreground: reload if stale (>30 min), else check for SW update
        let hiddenAt = 0
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') {
            hiddenAt = Date.now()
          } else if (hiddenAt > 0) {
            const away = Date.now() - hiddenAt
            hiddenAt = 0
            if (away > 30 * 60 * 1000) reload()
            else if (swReg) swReg.update()
          }
        })
      }
    </script>
  </body>
</html>
